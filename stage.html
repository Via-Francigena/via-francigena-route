<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage | Via Francigena</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><div class="wrap"><div><small>PILGRIM ROUTE</small><h1>Via Francigena</h1></div><nav><a href="index.html">Overview</a><a href="join.html">How to join</a></nav></div></header><main class="wrap narrow"><section class="card" id="detail"></section><a href="index.html">← Back to overview</a></main><footer><div class="wrap">Via Francigena route planner</div></footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>fetch('data/stages.json').then(r=>r.json()).then(a=>{let s=a.find(x=>x.id===new URLSearchParams(location.search).get('id'))||a[0];document.title=s.title+' | Via Francigena';document.querySelector('#detail').innerHTML=`<small>${s.rest?'REST DAY':'STAGE'}</small><h2>${s.title}</h2><p><b>${s.date}</b> · ${s.start} → ${s.end}</p><div class="stats"><div><b>${s.distance==null?'—':s.distance+' km'}</b><span>distance</span></div><div><b>${s.difficulty==null?'—':s.difficulty}</b><span>difficulty</span></div><div><b>${s.ascent==null?'—':s.ascent+' m'}</b><span>ascent</span></div></div><div id="map" style="margin-top:24px"></div>`;if(s.lat!=null){let m=L.map('map').setView([s.lat,s.lon],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);L.marker([s.lat,s.lon]).addTo(m).bindPopup(s.start).openPopup()}else document.querySelector('#map').innerHTML='<p>Map coordinates for this stage will be added as the route data is completed.</p>'})</script></body></html>
