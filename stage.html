<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stage | Via Francigena</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header><div class="wrap"><div><small>PILGRIM ROUTE</small><h1>Via Francigena</h1></div><nav><a href="index.html">Overview</a><a href="join.html">How to join</a></nav></div></header>
<main class="wrap narrow">
  <section class="card" id="detail"></section>
  <section class="card" id="accommodation">
    <small>STAGE END TOWN</small>
    <h2>Accommodation suggestions</h2>
    <div id="accommodation-content" class="details placeholder">Loading accommodation options...</div>
  </section>
  <section class="card" id="travel">
    <small>JOINING THE ROUTE</small>
    <h2>Travel information</h2>
    <div id="travel-content" class="details placeholder">Loading travel information...</div>
  </section>
  <section class="card" id="notes" style="display:none;">
    <small>ADDITIONAL INFO</small>
    <h2>Notes</h2>
    <div id="notes-content" class="details"></div>
  </section>
  <a href="index.html">← Back to overview</a>
</main>
<footer><div class="wrap">Via Francigena route planner</div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const stageSheetStyle = document.createElement('style');
stageSheetStyle.textContent = `
  .details { line-height: 1.7; color: #2b3741; white-space: pre-line; }
  .details ul { margin: 0; padding-left: 1.2rem; }
  .details.placeholder { color: #6d7b82; }
  .map-image-box { margin-top: 24px; border: 1px solid #d8d0c3; border-radius: 18px; padding: 16px; background: #fffdf9; box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
  .map-image-box figcaption { margin-bottom: 12px; font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #536069; }
  .map-image-box img { display: block; width: 100%; height: auto; border: 1px solid #d8d0c3; border-radius: 12px; }
  .sheet-warning { margin-top: 14px; padding: 12px 14px; border-left: 4px solid #c77f00; background: #fff5dc; color: #5a3d00; border-radius: 8px; }
`;
document.head.appendChild(stageSheetStyle);

const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1uLT1fDiUSkvvSRP6XqeevHDxEpTXCPz2_Q3f1uSIbQd_L4qscUNiwSV_E7QOaUW2Z-Up-VqPKYZt/pub?gid=1880407781&single=true&output=csv';

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showSheetWarning(message) {
  const main = document.querySelector('main') || document.body;
  const warning = document.createElement('div');
  warning.className = 'sheet-warning';
  warning.textContent = message;
  main.appendChild(warning);
}

const stageImageFiles = {
  'A': '01Aigle StMaurice map.png',
  '1': '01Aigle StMaurice map.png',
  '2': '02 StMaurice Martigny Map.png',
  '3': '03 martigny orsieres map.png',
  '4': '04 orsieres bourg saint piere map.png',
  '5': '05 Bourgsaintpierre col du saint bernard map.png',
  '6': '06 ColDuStBernard to Echevennoz map.png',
  '7': '07Echevennoz Aosta Map.png',
  '8': '08Aosta Chatillon map.png',
  '9': '09 Chatillon Verres map.png',
  '10': '10 Verres PontStMart Map.png',
  '11': '11 PontStMart Ivrea Map.png',
  '12': '12 Ivrea Viverone map.png',
  '13': '13 Viverone Santhia Map.png',
  '14': '14 Santhia Vercelli Map.png',
  '15': '15 Vercelli Robbio Map.png',
  '16': '16 Robbio Mortara Map.png',
  '17': '17 Mortara Garlasco Map.png',
  '18': '18 Garlasco Pavia Mapq.png',
  '39': '39 Siena Pontedearbia map.png',
  '40': '40 PonteDA SanQuirico Ele.png',
  '41': '41 SanQuirico Radicofani Map.png'
};

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      rows.push(row); row = [];
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function buildSheetMap(values) {
  if (!values || !values.length) return {};
  const headers = values[0].map(h => String(h).trim());
  const map = {};

  values.slice(1).forEach(row => {
    const item = {};
    headers.forEach((header, index) => {
      item[header] = (row[index] || '').trim();
    });
    const id = String(item.stage_id || '').trim();
    if (id) map[id] = item;
  });

  return map;
}

async function loadSheetData() {
  try {
    const response = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const map = buildSheetMap(parseCSV(await response.text()));
    console.log('Google Sheet CSV loaded successfully:', Object.keys(map).length, 'stage rows');
    return map;
  } catch (error) {
    console.error('Unable to load Google Sheet data:', error);
    showSheetWarning('Could not load live accommodation, travel and notes data from the Google Sheet.');
    return {};
  }
}

function formatAccommodation(sheetRow) {
  const items = [];
  for (let i = 1; i <= 4; i++) {
    const value = (sheetRow[`accommodation_${i}`] || '').trim();
    if (value) items.push(value);
  }
  if (!items.length) return null;
  return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
}

function formatTransport(sheetRow) {
  const value = (sheetRow.transport || '').trim();
  return value || null;
}

function formatNotes(sheetRow) {
  return (sheetRow.notes || '').trim();
}

function updateStageFromSheet(stage, sheetRow) {
  if (!sheetRow) return;

  if (sheetRow.distance_km) stage.distance = Number(sheetRow.distance_km);
  if (sheetRow.ascent_m) stage.ascent = Number(sheetRow.ascent_m);
  if (sheetRow.descent_m) stage.descent = Number(sheetRow.descent_m);
  if (sheetRow.start_lat && sheetRow.start_lon) {
    stage.lat = Number(sheetRow.start_lat);
    stage.lon = Number(sheetRow.start_lon);
  }
  if (sheetRow.end_lat && sheetRow.end_lon) {
    stage.endLat = Number(sheetRow.end_lat);
    stage.endLon = Number(sheetRow.end_lon);
  }
}

Promise.all([
  fetch('data/stages.json').then(r => r.json()),
  loadSheetData()
]).then(([stages, sheetMap]) => {
  const id = new URLSearchParams(location.search).get('id');
  const index = stages.findIndex(stage => String(stage.id) === String(id));
  const stage = stages[index] || stages[0];
  const sheetRow = sheetMap[String(stage.id)] || {};

  if (sheetRow && Object.keys(sheetRow).length) {
    updateStageFromSheet(stage, sheetRow);
  }

  const nextLocatedStage = stages.slice(index + 1).find(entry => entry.lat != null && entry.lon != null);
  const start = stage.lat != null && stage.lon != null ? [stage.lat, stage.lon] : null;
  const end = stage.endLat != null && stage.endLon != null
    ? [stage.endLat, stage.endLon]
    : nextLocatedStage ? [nextLocatedStage.lat, nextLocatedStage.lon] : null;

  document.title = stage.title + ' | Via Francigena';
  const detail = document.querySelector('#detail');
  detail.innerHTML = `
    <small>${stage.rest ? 'REST DAY' : 'STAGE'}</small>
    <h2>${stage.title}</h2>
    <p><b>${stage.date}</b> · ${stage.start} → ${stage.end}</p>
    <div class="stats">
      <div><b>${stage.distance == null ? '—' : stage.distance + ' km'}</b><span>distance</span></div>
      <div><b>${stage.difficulty == null ? '—' : stage.difficulty}</b><span>difficulty</span></div>
      <div><b>${stage.ascent == null ? '—' : stage.ascent + ' m'}</b><span>ascent</span></div>
    </div>
    <div id="map" style="margin-top:24px"></div>
  `;

  const accommodationContent = document.querySelector('#accommodation-content');
  const accommodationHtml = formatAccommodation(sheetRow);
  if (accommodationHtml) {
    accommodationContent.innerHTML = accommodationHtml;
    accommodationContent.classList.remove('placeholder');
  } else {
    accommodationContent.textContent = 'Accommodation suggestions for the stage end town will be added here.';
  }

  const travelContent = document.querySelector('#travel-content');
  const travelText = formatTransport(sheetRow);
  if (travelText) {
    travelContent.textContent = travelText;
    travelContent.classList.remove('placeholder');
  } else {
    travelContent.textContent = 'Travel information for people joining at this stage will be added here.';
  }
  if (!Object.keys(sheetRow).length) console.warn('No sheet row found for stage_id', stage.id);

  const notesText = formatNotes(sheetRow);
  if (notesText) {
    document.querySelector('#notes').style.display = 'block';
    document.querySelector('#notes-content').textContent = notesText;
  }

  const mapElement = document.querySelector('#map');
  if (!start && !end) {
    mapElement.innerHTML = '<p class="placeholder">Map coordinates for this stage will be added as the route data is completed.</p>';
  } else {
    const points = [start, end].filter(Boolean);
    const map = L.map('map').setView(points[0], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    if (start) {
      L.marker(start).addTo(map).bindPopup('<b>Start</b><br>' + stage.start).openPopup();
    }
    if (end) {
      L.marker(end).addTo(map).bindPopup('<b>Finish</b><br>' + stage.end);
    }
    if (start && end) {
      L.polyline([start, end], {color: '#2d6cdf', weight: 4, opacity: 0.9}).addTo(map);
      map.fitBounds(L.latLngBounds([start, end]).pad(0.25));
    } else {
      map.setView(points[0], 11);
    }
  }

  const fileName = stageImageFiles[String(stage.id)];
  if (fileName) {
    const figure = document.createElement('figure');
    figure.className = 'map-image-box';
    figure.innerHTML = `
      <figcaption>Detailed route map</figcaption>
      <img src="${fileName}" alt="Detailed route map for ${stage.title}" />
    `;
    detail.appendChild(figure);
  }
}).catch(error => console.error('Error loading stage data:', error));
</script>
</body>
</html>
